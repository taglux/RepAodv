# =============================================================================
# omnetpp.ini — REP-AODV simulation
#
# Configs:
#   BaselineAODV   — стандартный AODV (репутация отключена), без атаки, 1 прогон
#   RepAODV        — REP-AODV (репутация включена), без атаки, 1 прогон
#   AttackTestRA1  — REP-AODV + blackhole (узлы 2, 10)  — центр сетки
#   AttackTestRA2  — REP-AODV + blackhole (узлы 0, 19)  — углы сетки
#   AttackTestRA3  — REP-AODV + blackhole (узлы 1, 14)  — критический маршрут
#   AttackTestRA4  — REP-AODV + blackhole (узлы 6,  7)  — соседние узлы
#   AttackTestRA5  — REP-AODV + blackhole (узлы 5, 12)  — диагональная пара
# =============================================================================

[General]
sim-time-limit = 300s
record-eventlog = false
cmdenv-express-mode = true
repeat = 10
seed-set = ${repetition}

*.configurator.addStaticRoutes = false
*.configurator.addSubnetRoutes = false
*.configurator.addDefaultRoutes = false

**.osgVisualizer.typename = ""
*.visualizer.mediumVisualizer.displaySignals = true
*.visualizer.physicalLinkVisualizer.displayLinks = true

**.wlan[*].typename = "AckingWirelessInterface"
**.wlan[*].bitrate = 2Mbps
**.wlan[*].mac.headerLength = 23B
**.wlan[*].radio.typename = "UnitDiskRadio"
**.wlan[*].radio.transmitter.headerLength = 96b
**.wlan[*].radio.transmitter.communicationRange = 250m
**.wlan[*].radio.transmitter.interferenceRange = 0m
**.wlan[*].radio.transmitter.detectionRange = 0m
**.wlan[*].radio.receiver.ignoreInterference = true

**.networkLayer.**.cmdenv-log-level = warn
**.wlan[*].**.cmdenv-log-level = warn
**.routing.cmdenv-log-level = warn

# =============================================================================
# Базовая конфигурация: 20-узловая сетка + два UDP-потока
# Не запускается напрямую (нет network=, нет параметров протокола).
# =============================================================================
[Config _GridBase]
network = disserprotocol.repaodv.RepAodvNetwork

*.numHosts = 20

# Реальный диаметр 5×4 grid ≤7 hop; 12 даёт запас. Уменьшение с 35 сокращает
# blacklistTimeout (rreqRetries * netTraversalTime) и pathDiscoveryTime.
**.routing.netDiameter = 12
# nextHopWait=0.05s (дефолт) слишком мало для статической сети с конкурентными потоками
# → ложные RREP-ACK таймауты → spurious blacklisting → постоянная потеря маршрута.
# 600s > sim-time-limit → RREP-ACK таймаут никогда не срабатывает в симуляции.
**.routing.nextHopWait = 600s
**.routing.useLinkLayerFeedback = true
**.arp.typename = "GlobalArp"

# --- Топология: сетка 5×4, шаг 200м, communicationRange = 250м ---
#
#  y\x  100   300   500   700   900
#  300  [5]   [6]   [7]   [8]
#  400  [13]  [14]  [15]  [16]  [17]
#  500  [0]   [1]   [2]   [3]   [4]
#  600  [18]        [19]
#  700  [9]   [10]  [11]  [12]
#  sink: (500, 500) — совпадает с позицией host[2], но это отдельный модуль

*.sink.mobility.typename = "StationaryMobility"
*.sink.mobility.initialX = 1000m
*.sink.mobility.initialY = 1000m
*.sink.mobility.initialZ = 0m

*.host[*].mobility.typename = "StationaryMobility"
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.constraintAreaMinX = 0m
*.host[*].mobility.constraintAreaMinY = 0m
*.host[*].mobility.constraintAreaMinZ = 0m
*.host[*].mobility.constraintAreaMaxX = 1000m
*.host[*].mobility.constraintAreaMaxY = 1000m
*.host[*].mobility.constraintAreaMaxZ = 0m

*.host[0].mobility.initialX  = 100m
*.host[0].mobility.initialY  = 500m
*.host[1].mobility.initialX  = 300m
*.host[1].mobility.initialY  = 500m
*.host[2].mobility.initialX  = 500m
*.host[2].mobility.initialY  = 500m
*.host[3].mobility.initialX  = 700m
*.host[3].mobility.initialY  = 500m
*.host[4].mobility.initialX  = 900m
*.host[4].mobility.initialY  = 500m
*.host[5].mobility.initialX  = 200m
*.host[5].mobility.initialY  = 300m
*.host[6].mobility.initialX  = 400m
*.host[6].mobility.initialY  = 300m
*.host[7].mobility.initialX  = 600m
*.host[7].mobility.initialY  = 300m
*.host[8].mobility.initialX  = 800m
*.host[8].mobility.initialY  = 300m
*.host[9].mobility.initialX  = 200m
*.host[9].mobility.initialY  = 700m
*.host[10].mobility.initialX = 400m
*.host[10].mobility.initialY = 700m
*.host[11].mobility.initialX = 600m
*.host[11].mobility.initialY = 700m
*.host[12].mobility.initialX = 800m
*.host[12].mobility.initialY = 700m
*.host[13].mobility.initialX = 100m
*.host[13].mobility.initialY = 400m
*.host[14].mobility.initialX = 300m
*.host[14].mobility.initialY = 400m
*.host[15].mobility.initialX = 500m
*.host[15].mobility.initialY = 400m
*.host[16].mobility.initialX = 700m
*.host[16].mobility.initialY = 400m
*.host[17].mobility.initialX = 900m
*.host[17].mobility.initialY = 400m
*.host[18].mobility.initialX = 300m
*.host[18].mobility.initialY = 600m
*.host[19].mobility.initialX = 700m
*.host[19].mobility.initialY = 600m

# --- Поток 1: host[0] → host[4] ---
*.host[0].numApps = 1
*.host[0].app[0].typename = "UdpBasicApp"
*.host[0].app[0].destAddresses = "host[4](ipv4)"
*.host[0].app[0].destPort = 1000
*.host[0].app[0].startTime = 5s
*.host[0].app[0].sendInterval = 0.5s
*.host[0].app[0].messageLength = 1024B
*.host[0].app[0].chooseDestAddrMode = "once"

*.host[4].numApps = 1
*.host[4].app[0].typename = "UdpSink"
*.host[4].app[0].localPort = 1000

# --- Поток 2: host[13] → host[17] ---
*.host[13].numApps = 1
*.host[13].app[0].typename = "UdpBasicApp"
*.host[13].app[0].destAddresses = "host[17](ipv4)"
*.host[13].app[0].destPort = 1001
*.host[13].app[0].startTime = 6s
*.host[13].app[0].sendInterval = 0.5s
*.host[13].app[0].messageLength = 1024B
*.host[13].app[0].chooseDestAddrMode = "once"

*.host[17].numApps = 1
*.host[17].app[0].typename = "UdpSink"
*.host[17].app[0].localPort = 1001

# =============================================================================
# Базовый AODV (без репутации, без атаки) — 1 прогон
# =============================================================================
[Config BaselineAODV]
extends = _GridBase
description = "Стандартный AODV (репутация отключена), без атаки"

**.routing.enableTwoAck = false
**.routing.enableAnomalyDetection = false
**.routing.weightReputation = 0.0
**.routing.minReputationThreshold = 0.0
**.routing.reputationUpdateInterval = 100000s
**.routing.watchdogSuspectThreshold = 99999
# 300s = sim-time-limit: маршруты никогда не истекают → нет expunge/re-discovery в статичной сети
**.routing.activeRouteTimeout = 300s

# =============================================================================
# REP-AODV (с репутацией, без атаки) — 1 прогон
# =============================================================================
[Config RepAODV]
extends = _GridBase
description = "REP-AODV (репутация включена), без атаки"

**.routing.enableAnomalyDetection = true
**.routing.alpha = 0.4
**.routing.minReputationThreshold = 0.3
**.routing.weightReputation = 2.0
**.routing.reputationUpdateInterval = 5s
**.routing.activeRouteTimeout = 12s
**.routing.maxRouteFailuresBeforeDead = 5

# =============================================================================
# Базовая конфигурация для сценариев с атакой (репутация включена)
# =============================================================================
[Config _AttackBase]
extends = _GridBase

**.routing.enableAnomalyDetection = true
**.routing.alpha = 0.5
**.routing.minReputationThreshold = 0.3
**.routing.initialReputation = 0.6
**.routing.weightReputation = 1.0
**.routing.reputationUpdateInterval = 30s
**.routing.activeRouteTimeout = 60s
**.routing.maxRouteFailuresBeforeDead = 10
**.routing.reputationBatchSize = 5
**.routing.watchdogAckThreshold = 0.6
**.routing.watchdogAckBatchSize = 3
**.routing.watchdogSuspectThreshold = 5
**.routing.watchdogGracePeriod = 0.3s
**.routing.trustThreshold = 0.5
**.routing.suspiciousSeqJump = 20
**.routing.rreqRetries = 4
**.routing.quarantineDuration = 60s

*.host[*].routing.isBlackhole = false

# =============================================================================
# Базовая конфигурация для сценариев с атакой (репутация отключена — baseline)
# =============================================================================
[Config _BaselineAttackBase]
extends = _GridBase

**.routing.enableTwoAck = false
**.routing.enableAnomalyDetection = false
**.routing.weightReputation = 0.0
**.routing.minReputationThreshold = 0.0
**.routing.reputationUpdateInterval = 100000s
**.routing.watchdogSuspectThreshold = 99999

*.host[*].routing.isBlackhole = false

# =============================================================================
# Baseline AODV + атака: те же пары blackhole-узлов, репутация отключена
# =============================================================================

[Config BaselineAttackRA1]
extends = _BaselineAttackBase
description = "Baseline AODV + blackhole (узлы 2, 11) — центр сетки"
*.host[2].routing.isBlackhole = true
*.host[11].routing.isBlackhole = true

[Config BaselineAttackRA2]
extends = _BaselineAttackBase
description = "Baseline AODV + blackhole (узлы 3, 16) — предфинальные узлы"
*.host[3].routing.isBlackhole = true
*.host[16].routing.isBlackhole = true

[Config BaselineAttackRA3]
extends = _BaselineAttackBase
description = "Baseline AODV + blackhole (узлы 1, 14) — критический маршрут"
*.host[1].routing.isBlackhole = true
*.host[14].routing.isBlackhole = true

[Config BaselineAttackRA4]
extends = _BaselineAttackBase
description = "Baseline AODV + blackhole (узлы 6, 7) — соседние узлы"
*.host[6].routing.isBlackhole = true
*.host[7].routing.isBlackhole = true

[Config BaselineAttackRA5]
extends = _BaselineAttackBase
description = "Baseline AODV + blackhole (узлы 5, 12) — диагональная пара"
*.host[5].routing.isBlackhole = true
*.host[12].routing.isBlackhole = true

# =============================================================================
# REP-AODV + атака: случайное назначение blackhole-узлов (5 прогонов)
# Топология фиксирована, меняется только пара атакующих узлов.
# =============================================================================

[Config AttackTestRA1]
extends = _AttackBase
description = "REP-AODV + blackhole (узлы 2, 11) — центр сетки"
*.host[2].routing.isBlackhole = true
*.host[11].routing.isBlackhole = true

[Config AttackTestRA2]
extends = _AttackBase
description = "REP-AODV + blackhole (узлы 3, 16) — предфинальные узлы"
*.host[3].routing.isBlackhole = true
*.host[16].routing.isBlackhole = true

[Config AttackTestRA3]
extends = _AttackBase
description = "REP-AODV + blackhole (узлы 1, 14) — критический маршрут"
*.host[1].routing.isBlackhole = true
*.host[14].routing.isBlackhole = true

[Config AttackTestRA4]
extends = _AttackBase
description = "REP-AODV + blackhole (узлы 6, 7) — соседние узлы"
*.host[6].routing.isBlackhole = true
*.host[7].routing.isBlackhole = true

[Config AttackTestRA5]
extends = _AttackBase
description = "REP-AODV + blackhole (узлы 5, 12) — диагональная пара"
*.host[5].routing.isBlackhole = true
*.host[12].routing.isBlackhole = true

[Config AttackTestSmartBH]
extends = _AttackBase
description = "REP-AODV + smart blackhole (узлы 2, 11) — small seq jump"
*.host[2].routing.isBlackhole = true
*.host[11].routing.isBlackhole = true
*.host[*].routing.blackholeSeqNumJump = 2

# =============================================================================
# Мобильные сценарии (Random Waypoint Mobility, 1–5 м/с)
# =============================================================================

[Config _MobileAttackBase]
extends = _AttackBase
description = "Абстрактный базовый: _AttackBase + RWP-мобильность"
*.host[*].mobility.typename = "RandomWaypointMobility"
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.speed = uniform(1mps, 5mps)
*.host[*].mobility.waitTime = uniform(0s, 2s)

[Config RepMobileAODV]
extends = RepAODV
description = "REP-AODV с мобильностью, без атаки — бейзлайн overhead"
*.host[*].mobility.typename = "RandomWaypointMobility"
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.speed = uniform(1mps, 5mps)
*.host[*].mobility.waitTime = uniform(0s, 2s)

[Config AttackMobileRA1]
extends = _MobileAttackBase
description = "REP-AODV + RWP + blackhole (узлы 2, 11) — мобильный сценарий RA1"
*.host[2].routing.isBlackhole = true
*.host[11].routing.isBlackhole = true

[Config BaselineAttackMobileRA1]
extends = _MobileAttackBase
description = "Baseline AODV + RWP + blackhole (узлы 2, 11) — контрольная группа"
*.host[2].routing.isBlackhole = true
*.host[11].routing.isBlackhole = true
**.routing.enableTwoAck = false
**.routing.enableAnomalyDetection = false
